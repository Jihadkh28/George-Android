name: Build George APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Unpack George
        run: unzip -o George_Android_v0.1_CI.zip

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Build George APK
        run: |
          cd george_android_v1
          gradle --no-daemon assembleDebug

      - name: Upload George APK
        uses: actions/upload-artifact@v4
        with:
          name: George-Android-v0.1
          path: george_android_v1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
